<h2>Agenda de hoy</h2>
<ol class="agenda">
  @for (e of lista(); track e.inicio) {
    <li
      class="evento"
      [class.evento-pasado]="e.estado === 'pasado'"
      [class.evento-actual]="e.estado === 'actual'"
      [class.evento-siguiente]="e.estado === 'siguiente'"
    >
      <span class="evento-hora">{{ e.inicio }}–{{ e.fin }}</span>
      <div class="evento-cuerpo">
        <span class="evento-titulo">{{ e.titulo }}</span>
        @if (e.lugar) {
          <span class="evento-lugar">{{ e.lugar }}</span>
        }
      </div>
      @if (e.estado === 'actual') {
        <span class="etiqueta">Ahora</span>
      } @else if (e.estado === 'siguiente') {
        <span class="etiqueta">Siguiente</span>
      }
    </li>
  } @empty {
    <li class="vacio">No tienes nada en la agenda hoy.</li>
  }
</ol>
