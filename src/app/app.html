<app-cabecera />

<nav class="navegacion" aria-label="Secciones del panel">
  <ul>
    @for (s of secciones; track s.id) {
      <li><a routerLink="." [fragment]="s.id">{{ s.nombre }}</a></li>
    }
  </ul>
</nav>

<main class="rejilla">
  <section class="tarjeta" id="agenda">
    <app-agenda [eventos]="datos().agenda" />
  </section>

  <section class="tarjeta" id="prioridades">
    <app-prioridades [prioridades]="datos().prioridades" />
  </section>

  <section class="tarjeta" id="habitos">
    <app-habitos [habitos]="datos().habitos" />
  </section>

  <section class="tarjeta tarjeta-ancha" id="objetivos">
    <app-objetivos [objetivos]="datos().objetivos" />
  </section>

  <section class="tarjeta tarjeta-ancha" id="viajes">
    <app-viajes [viajes]="datos().viajes" />
  </section>

  <section class="tarjeta tarjeta-ancha" id="datos">
    <app-tus-datos />
  </section>
</main>
