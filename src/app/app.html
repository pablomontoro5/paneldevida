<div class="marco">
  <nav class="menu-lateral" aria-label="Secciones del panel">
    @for (g of grupos; track g.titulo) {
      <div class="grupo">
        <h2 class="grupo-titulo">{{ g.titulo }}</h2>
        <ul>
          @for (e of g.enlaces; track e.ruta) {
            <li>
              <a
                class="menu-enlace"
                [routerLink]="e.ruta"
                routerLinkActive="activo"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <span class="menu-icono" aria-hidden="true">{{ e.icono }}</span>
                {{ e.nombre }}
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <div class="principal">
    <app-cabecera />
    <main class="contenido">
      <router-outlet />
    </main>
  </div>
</div>

<nav class="barra-movil" aria-label="Secciones del panel">
  @for (e of barra; track e.ruta) {
    <a
      class="barra-enlace"
      [routerLink]="e.ruta"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="barra-icono" aria-hidden="true">{{ e.icono }}</span>
      <span class="barra-nombre">{{ e.nombre }}</span>
    </a>
  }
</nav>
