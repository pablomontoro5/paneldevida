<header class="cabecera">
    <!-- En el inicio no hay título: allí el protagonista es la bienvenida -->
    @if (seccion(); as titulo) {
        <h1 class="titulo">{{ titulo }}</h1>
    }
    <div class="acciones">
        <button class="boton-tema" type="button" (click)="cambiarTema()">
            {{ textoBoton() }}
        </button>
        <!-- En el móvil, «Tus datos» no cabe en la barra inferior y se abre desde aquí -->
        <a class="boton-tema boton-datos" routerLink="/datos" aria-label="Tus datos">⚙️</a>
    </div>
</header>
