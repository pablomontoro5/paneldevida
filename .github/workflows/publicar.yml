name: Publicar en GitHub Pages

on:
  push:
    branches: [main]      # cada vez que algo entra en main
  workflow_dispatch:      # y un botón para lanzarlo a mano

permissions:
  contents: read          # leer el código
  pages: write            # publicar en Pages
  id-token: write         # demostrar a Pages que es este repositorio

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /paneldevida/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/paneldevida/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4