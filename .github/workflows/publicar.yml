name: Publicar en GitHub Pages

on:
  push:
    branches: [main]      # cada vez que algo entra en main
  workflow_dispatch:      # y un botón para lanzarlo a mano

permissions:
  contents: read          # leer el código
  pages: write            # publicar en Pages
  id-token: write         # demostrar a Pages que es este repositorio

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # bajar el código

      - uses: actions/setup-node@v4        # instalar Node
        with:
          node-version: 24
          cache: npm                       # guardar las descargas de npm entre ejecuciones

      - run: npm ci                        # instalar las dependencias exactas del package-lock.json

      - run: npx ng build --base-href /paneldevida/   # compilar para la dirección de Pages

      # Pages no conoce las rutas de Angular: al recargar /paneldevida/habitos devolvería su 404.
      # Con una copia del index.html como 404.html, carga la app y el router abre la sección.
      - run: cp dist/paneldevida/browser/index.html dist/paneldevida/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/paneldevida/browser   # subir solo lo compilado

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4